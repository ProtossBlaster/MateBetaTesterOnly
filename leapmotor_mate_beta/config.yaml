name: "LeapMotor Mate — BetaTester"
description: "RESEARCH build: the same Mate as the official one, plus full raw-signal capture, the research logbook and the encrypted export. REEV support itself is in the OFFICIAL build since 4.7.0 — this channel stays open for now, for the testers who have not moved across yet. Report anything that looks broken (an event counted twice, a duplicate row). Use a Leapmotor account that is NOT used by your normal Mate at the same time."
version: "4.7.8"
slug: "leapmotor_mate_beta"
url: "https://github.com/ProtossBlaster/MateBetaTesterOnly"
# Runs the SAME official image AND version number as prod — kept in lockstep by
# leapmotor-mate/.github/workflows/sync-beta-addon.yml on every release. Research / data-collection
# (full-signal capture + REEV) is turned ON at runtime by the `research` option below (see run.sh),
# NOT by a separate image or a "beta" tag. So the version is a real number and updates arrive via the
# normal "Update" button.
# Historical literal "beta" installs: Supervisor supports same-slug in-place updates
# through version inequality, but Core's update-entity dialog orders "beta" above
# numbered versions and may disable the UI. Do not infer a mandatory reinstall or
# database restore from AwesomeVersion ordering. A zero-extra-action historical UI
# transition remains unverified; numbered installations use the normal update path.
image: "ghcr.io/protossblaster/leapmotor-mate"
init: false
startup: "application"
boot: "auto"
homeassistant: "2024.1.0"
homeassistant_api: true

arch:
  - aarch64
  - amd64

map:
  - type: data
    read_only: false

ingress: true
ingress_port: 4000
panel_icon: "mdi:flask-outline"
panel_title: "Mate BetaTester"

ports:
  4000/tcp: null
ports_description:
  4000/tcp: "Web UI (not needed with ingress)"

options:
  log_level: "info"
  research: true

schema:
  log_level: "list(trace|debug|info|warning|error|critical)"
  research: "bool"
